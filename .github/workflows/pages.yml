name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'samples/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp dist/deepacket.html _site/index.html
          cp samples/attack_scenario.pcap _site/attack_scenario.pcap
          cp assets/logo-256.png _site/logo.png
          cp assets/og.png _site/og.png
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://zerovectorlabs.github.io/deepacket/</loc><lastmod>%s</lastmod></url></urlset>\n' "$(date -u +%F)" > _site/sitemap.xml
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
